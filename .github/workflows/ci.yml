name: CI

on:
  push:
    branches: [main, "lab/s**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Type check
        run: npm run build

      - name: Run tests
        run: npm test
